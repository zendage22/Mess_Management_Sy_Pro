                function togglePassword(fieldId, iconId) {
    const passwordField = document.getElementById(fieldId);

    if (passwordField.type === "password") {

    } else {
        passwordField.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

    <script>
        document.getElementById('registrationForm').onsubmit = function(e) {
            const fname = document.getElementById('fname').value.trim();
            const lname = document.getElementById('lname').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
    
            // Name validation (only letters)
            const namePattern = /^[A-Za-z]+$/;
            if (!namePattern.test(fname)) {
                alert("First name should only contain letters.");
                e.preventDefault();
                return;
            }
            if (!namePattern.test(lname)) {
                alert("Last name should only contain letters.");
                e.preventDefault();
                return;
            }
    
            // Password validation (at least 8 characters, must contain letters, numbers, and special characters)
            function togglePassword(fieldId, iconId) {
        const passwordField = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (passwordField.type === "password") {
            passwordField.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            passwordField.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    document.getElementById('registrationForm').onsubmit = function(e) {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Password pattern: At least 8 characters, one letter, one number, one special character
        const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
        if (!passwordPattern.test(password)) {
            alert("Password must be at least 8 characters long, with at least one letter, one number, and one special character.");
            e.preventDefault();
            return;
        }

        // Check if passwords match
        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            e.preventDefault();
        }
    };
        }
